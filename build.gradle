group = 'jameslee'
version = '1.0-SNAPSHOT'

apply plugin: 'java'
apply plugin: 'idea'
apply plugin: 'eclipse'

sourceCompatibility = JavaVersion.VERSION_1_8
targetCompatibility = JavaVersion.VERSION_1_8

idea {
    project {
        jdkName = '1.8'
        languageLevel = '1.8'
    }
}

repositories {
    mavenCentral()
}

dependencies {
    implementation 'org.apache.spark:spark-core_2.10:2.0.0'
    implementation 'org.apache.spark:spark-sql_2.10:2.1.0'
}

tasks.named('jar') {

    zip64 true

    archiveFileName = 'StackOverFlowSurvey-spark.jar'

    duplicatesStrategy = DuplicatesStrategy.EXCLUDE

    from {
        configurations.runtimeClasspath.collect {
            it.isDirectory() ? it : zipTree(it)
        }
    }

    manifest {
        attributes(
                'Main-Class': 'com.sparkTutorial.sparkSql.StackOverFlowSurvey'
        )
    }

    exclude(
            'META-INF/*.RSA',
            'META-INF/*.SF',
            'META-INF/*.DSA',
            'META-INF/DEPENDENCIES',
            'META-INF/LICENSE',
            'META-INF/LICENSE.txt',
            'META-INF/LICENSE*',
            'META-INF/NOTICE',
            'META-INF/NOTICE.txt',
            'META-INF/NOTICE*'
    )
}